name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            
            cd /var/www/codeigniter

            sudo setfacl -R -m u:1000:rwX /var/www/codeigniter

            git fetch origin
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader

            sudo chown -R www-data:www-data writable
            echo "Ownership after chown:"
            ls -ld writable writable/cache

            echo "Deployment completed successfully."
          EOF